<style>
  :root {
    --bg: #0e2a1f;
    --bg2: #16382a;
    --ink: #f4efe6;
    --ink-muted: #b9c7be;
    --gold: #b8935a;
    --gold-bright: #e8c88a;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: Inter, system-ui, sans-serif;
    --arabic: Amiri, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% -10%, var(--bg2) 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: var(--sans);
    text-align: center;
    padding: 3rem 1.5rem calc(3rem + env(safe-area-inset-bottom));
  }
  main { max-width: 34rem; }
  .mark { width: min(58vw, 15rem); margin-inline: auto; }
  .ring, .knot {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 3200ms cubic-bezier(.37,0,.19,1) forwards;
  }
  .ring { animation-duration: 1400ms; animation-delay: 2000ms; }
  .weave { opacity: 0; animation: fadein 800ms linear 900ms forwards; }
  .qaf-letter {
    font-family: var(--arabic);
    fill: var(--gold);
    font-size: 50px;
    opacity: 0;
    animation: fadein 900ms ease-out 1600ms forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  .rise { opacity: 0; transform: translateY(14px); animation: rise 720ms cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .d1 { animation-delay: 2200ms; } .d2 { animation-delay: 2350ms; }
  .d3 { animation-delay: 2500ms; } .d4 { animation-delay: 2650ms; }
  .d5 { animation-delay: 2800ms; } .d6 { animation-delay: 3000ms; }
  .eyebrow {
    font-size: .68rem;
    font-weight: 500;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 2.5rem;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-variant-caps: small-caps;
    letter-spacing: .08em;
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    line-height: 1.02;
    margin-top: .75rem;
  }
  .rule { display: flex; align-items: center; justify-content: center; gap: .8rem; margin-top: 1.6rem; }
  .rule span { display: block; width: 4rem; height: 1px; background: color-mix(in srgb, var(--gold) 45%, transparent); }
  .rule i { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .tagline { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin-top: 1.6rem; color: var(--ink); }
  .season { font-size: .74rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-muted); margin-top: 1.1rem; }
  .count {
    margin-top: 2.2rem;
    font-variant-numeric: tabular-nums;
    font-size: .84rem;
    letter-spacing: .06em;
    color: var(--ink-muted);
    min-height: 1.4rem;
  }
  .count b { color: var(--gold-bright); font-weight: 500; }
  .dates {
    margin-top: 2.4rem;
    display: grid;
    gap: .55rem;
    font-size: .82rem;
    color: var(--ink-muted);
  }
  .dates div b { color: var(--ink); font-weight: 500; }
  .foot { margin-top: 3rem; display: grid; gap: .8rem; }
  .foot a { color: var(--gold); text-decoration: none; font-size: .82rem; letter-spacing: .04em; }
  .foot a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .powered { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); opacity: .8; }
  @media (prefers-reduced-motion: reduce) {
    .ring, .knot { animation: none; stroke-dashoffset: 0; }
    .weave, .qaf-letter, .rise { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>

<script>
  // Milestones as fixed UTC instants (Eastern Daylight Time = UTC-4 in September).
  var milestones = [
    { at: Date.UTC(2026, 8, 5, 21, 0, 0), label: "Community BBQ" },      // Sep 5, 5:00 PM ET
    { at: Date.UTC(2026, 8, 11, 22, 0, 0), label: "Opening program" },   // Sep 11, 6:00 PM ET
    { at: Date.UTC(2026, 8, 13, 13, 0, 0), label: "First classes" }      // Sep 13, 9:00 AM ET
  ];
  var el = document.getElementById("count");
  function tick() {
    var now = Date.now(), next = null;
    for (var i = 0; i < milestones.length; i++) {
      if (milestones[i].at > now) { next = milestones[i]; break; }
    }
    if (!next) { el.innerHTML = "<b>We have launched</b> — see you at ICEB"; return; }
    var ms = next.at - now;
    var d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    el.innerHTML = "<b>" + next.label + "</b> in " + d + "d " + h + "h " + m + "m";
    setTimeout(tick, 30000);
  }
  tick();
</script>
